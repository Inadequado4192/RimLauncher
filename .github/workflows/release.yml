
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"

          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Version mismatch: package.json=$VERSION, tag=$TAG"
            exit 1
          fi

      - name: Validate changelog
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if ! grep -Fq "## [v${VERSION}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain version v${VERSION}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Generate release notes
        run: node ./build/release-body.js

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
