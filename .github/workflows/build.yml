name: Build and Release App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/**
            !dist/builder-debug.yml
            !dist/builder-effective-config.yml
            !dist/win-unpacked/**
            !dist/linux-unpacked/**
            !dist/mac-arm64/**

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # Якщо workflow_dispatch → створюємо тимчасовий тег
      - name: Create temporary tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag temp-${{ github.sha }}
          git push origin temp-${{ github.sha }}

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && format('temp-{0}', github.sha) || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && format('Temp {0}', github.sha) || github.ref_name }}
          bodyFile: RELEASE.md
          artifacts: dist/**
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Якщо був тимчасовий тег → видаляємо його
      - name: Delete temporary tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git push --delete origin temp-${{ github.sha }}
          git tag -d temp-${{ github.sha }}